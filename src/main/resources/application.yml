spring:
  application:
    name: plannif-data

  datasource:
    url: jdbc:h2:file:./data/planning;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MariaDB
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
server:
  port: 8080

plannif-data:
  api:
    base-url: http://localhost:8080

planning:
  teaching-weeks: 36
  standard-session-duration-hours: 2.0
  solver:
    spent-limit-seconds: 120
    unimproved-spent-limit-seconds: 20
    environment-mode: NON_REPRODUCIBLE

logging:
  level:
    root: INFO
    liquibase: DEBUG
    org.liquibase: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: list
    filter: true
    try-it-out-enabled: true
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

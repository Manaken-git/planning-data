spring:
  application:
    name: plannif-data

  datasource:
    url: jdbc:mariadb://localhost:3306/planning_ecole
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver
    jpa:
      hibernate:
        ddl-auto: none
      properties:
        hibernate:
          dialect: org.hibernate.dialect.MariaDBDialect
          format_sql: true
          show_sql: true
    logging:
      level:
        org.hibernate.SQL: ERROR
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
server:
  port: 8081
  servlet:
    context-path: /planning-data

logging:
  liquibase.ui: TRACE

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: list
    filter: true
    try-it-out-enabled: true
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

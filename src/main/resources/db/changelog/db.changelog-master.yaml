databaseChangeLog:
  - changeSet:
      id: 1
      author: manaken
      changes:
        - createTable:
            tableName: professeur
            columns:
              - column:
                  name: id
                  type: BIGINT AUTO_INCREMENT
                  constraints:
                    primaryKey: true
              - column:
                  name: nom
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: prenom
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(150)
                  constraints:
                    unique: true

  - changeSet:
      id: 2
      author: manaken
      changes:
        - createTable:
            tableName: classe
            columns:
              - column:
                  name: id
                  type: BIGINT AUTO_INCREMENT
                  constraints:
                    primaryKey: true
              - column:
                  name: nom
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

  - changeSet:
      id: 3
      author: manaken
      changes:
        - createTable:
            tableName: matiere
            columns:
              - column:
